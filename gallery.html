<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cà Phê Mộc — Không gian quán</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<style>
  .page-banner {
    background: var(--xanh-la);
    color: var(--nen-trang);
    padding: 64px 24px;
    text-align: center;
  }
  .page-banner p { color: var(--vang-nhat); margin-top: 8px; }

  /* Grid ảnh dạng "masonry" đơn giản bằng grid-template-areas kết hợp
     grid-auto-rows để tạo bố cục so le, không cần thư viện ngoài */
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 160px;
    gap: 16px;
    margin-bottom: 64px;
  }
  .gallery-item {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
  }
  .gallery-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform .4s ease;
  }
  .gallery-item:hover img { transform: scale(1.1); }

  .gallery-item .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(20,25,18,.85), transparent 60%);
    display: flex;
    align-items: flex-end;
    padding: 14px;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .gallery-item:hover .overlay { opacity: 1; }
  .overlay span { color: var(--nen-trang); font-weight: 600; font-size: .9rem; }

  /* Kích thước ô khác nhau để tạo cảm giác so le */
  .gallery-item.wide  { grid-column: span 2; }
  .gallery-item.tall  { grid-row: span 2; }
  .gallery-item.big   { grid-column: span 2; grid-row: span 2; }

  @media (max-width: 720px) {
    .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    .gallery-item.big, .gallery-item.wide { grid-column: span 2; }
  }
</style>
</head>
<body>

<header class="site-header">
  <nav class="navbar">
    <a href="index.html" class="logo">Cà Phê Mộc</a>
    <ul class="nav-links">
      <li><a href="index.html">Trang chủ</a></li>
      <li><a href="about.html">Giới thiệu</a></li>
      <li><a href="menu.html">Thực đơn</a></li>
      <li><a href="gallery.html" aria-current="page">Không gian</a></li>
      <li><a href="contact.html">Liên hệ</a></li>
    </ul>
  </nav>
</header>

<main>
  <div class="page-banner">
    <h1>Không gian quán</h1>
    <p>Một vài khoảnh khắc tại Cà Phê Mộc</p>
  </div>

  <section class="container">
    <div class="gallery-grid">
      <div class="gallery-item big">
        <img src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=700" alt="Góc ngồi chính">
        <div class="overlay"><span>Góc ngồi chính</span></div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1447933601403-0c6688de566e?w=500" alt="Quầy pha chế">
        <div class="overlay"><span>Quầy pha chế</span></div>
      </div>
      <div class="gallery-item tall">
        <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=500" alt="Góc bánh ngọt">
        <div class="overlay"><span>Góc bánh ngọt</span></div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1493857671505-72967e2e2760?w=500" alt="Bàn ngoài trời">
        <div class="overlay"><span>Bàn ngoài trời</span></div>
      </div>
      <div class="gallery-item wide">
        <img src="https://images.unsplash.com/photo-1521017432531-fbd92d768814?w=700" alt="Kệ sách nhỏ">
        <div class="overlay"><span>Kệ sách nhỏ</span></div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=500" alt="Pha chế thủ công">
        <div class="overlay"><span>Pha chế thủ công</span></div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span>© 2026 Cà Phê Mộc</span>
    <span class="muted">123 Đường Gỗ Mộc, Quận 1, TP.HCM</span>
  </div>
</footer>

</body>
</html>
